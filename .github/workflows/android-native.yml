name: Android native validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/export_android.py"
      - "public/apple-touch-icon.png"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate, test and build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate Android Studio project
        run: python scripts/export_android.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run native unit tests
        working-directory: /tmp/philips-native/PhilipsRemote
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/philips-native/PhilipsRemote
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: philips-remote-debug-apk
          path: /tmp/philips-native/PhilipsRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
